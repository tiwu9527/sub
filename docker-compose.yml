services:
  next-dashboard:
    build:
      context: ./next-dashboard
      dockerfile: Dockerfile
    image: subscription-manager-dashboard:latest
    container_name: subscription-manager-dashboard
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}"
      ADMIN_COOKIE_SECURE: "${ADMIN_COOKIE_SECURE:-false}"
      APP_TIME_ZONE: "${APP_TIME_ZONE:-Asia/Shanghai}"
      TZ: "${APP_TIME_ZONE:-Asia/Shanghai}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_REPLY_TO: "${MAIL_REPLY_TO:-}"
