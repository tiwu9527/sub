services:
  next-dashboard:
    build:
      context: ./next-dashboard
      dockerfile: Dockerfile
    image: subscription-manager-dashboard:latest
    container_name: subscription-manager-dashboard
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
